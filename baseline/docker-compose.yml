services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: minicob
      POSTGRES_USER: minicob
      POSTGRES_PASSWORD: minicob
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minicob -d minicob"]
      interval: 5s
      timeout: 3s
      retries: 10
